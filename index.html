     <script>
    // Function to change the background image on page load
    function changeBackground() {
        // Array of image file names
        const images = [
            "one.jpg", "two.jpg", "three.jpg", "four.jpg", "five.jpg",
            "six.jpg", "seven.jpg", "eight.jpg", "nine.jpg", "ten.jpg",
            "eleven.jpg", "twelve.jpg", "thirteen.jpg", "fourteen.jpg"
        ];

        // Get a random index from the images array
        const randomIndex = Math.floor(Math.random() * images.length);

        // Set the background image of the body
        document.body.style.backgroundImage = `url('backgrounds/${images[randomIndex]}')`;
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundAttachment = 'fixed';
        document.body.style.backgroundSize = 'cover';
    }

    // Call the function on page load
    window.onload = changeBackground;
</script>

<script>
function openPopoverRandom(popoverId) {
    const pop = document.getElementById(popoverId);

    // Open FIRST so dimensions are real
    pop.showPopover();

    // Measure AFTER opening
    const w = pop.offsetWidth;
    const h = pop.offsetHeight;

    const margin = 40;
    const maxX = window.innerWidth - w - margin;
    const maxY = window.innerHeight - h - margin;

    // If popover is bigger than screen, clamp to top-left margin
    const x = Math.max(margin, Math.random() * maxX);
    const y = Math.max(margin, Math.random() * maxY);

    pop.style.left = `${x}px`;
    pop.style.top = `${y}px`;
}

document.querySelectorAll('[data-pop]').forEach(btn => {
    btn.addEventListener('click', () => {
        openPopoverRandom(btn.dataset.pop);
    });
});

</script>
